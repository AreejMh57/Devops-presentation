<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Operations Dashboard</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { color: var(--primary-color); margin-bottom: 20px; text-align: center; }
        
        .status-badge {
            background-color: #dcfce7;
            color: #166534;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover { background-color: #1d4ed8; }

        .footer { margin-top: 20px; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        
        <h1>Employee Directory</h1>
        <p style="text-align: center; color: #64748b;">Add new team members to the database</p>

        <form>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" placeholder="e.g. DevOps Engineer">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@company.com">
            </div>
            <button type="button">Register Employee</button>
        </form>
    </div>

    <div class="footer">
      
    </div>

</body>
</html>
